name: CI - Docker Compose Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Create .env for pipeline
        run: |
          cat > .env <<'EOF'
          email_password=123456
          django_secret_key=123456
          local=true
          DJANGO_SUPERUSER_USERNAME=ciadmin
          DJANGO_SUPERUSER_EMAIL=ci@example.com
          DJANGO_SUPERUSER_PASSWORD=cipassword
          EOF

      - name: Build and start services
        run: docker compose --profile local up -d --build

      - name: Run tests
        run: docker compose run --rm web python3 manage.py test --keepdb --verbosity=2

      - name: Tear down
        run: docker compose --profile local down --volumes --remove-orphans
